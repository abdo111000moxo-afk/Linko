name: Build Linko APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. تنزيل الكود
        uses: actions/checkout@v3

      - name: 2. إعداد بيئة جافا
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. إعداد بيئة نود
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: 4. تجهيز مجلد ملفات الويب
        run: |
          mkdir -p www
          cp index.html www/

      - name: 5. بناء بيئة أندرويد لـ Linko
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init Linko com.linko.share --web-dir www
          npx cap add android

          # إضافة الصلاحيات في ملف AndroidManifest تلقائياً
          sed -i '/<application/i <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />\n<uses-permission android:name="android.permission.INTERNET" />\n<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />' android/app/src/main/AndroidManifest.xml

          # بناء ملف الـ APK
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 6. استخراج ملف الـ APK وتجهيزه للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: Linko-Release-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
