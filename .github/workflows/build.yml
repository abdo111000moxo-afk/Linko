name: Build Linko APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. تنزيل الكود
        uses: actions/checkout@v4

      - name: 2. إعداد بيئة جافا
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. إعداد بيئة نود
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 4. تجهيز مجلد ملفات الويب
        run: |
          mkdir -p www
          cp index.html www/

      - name: 5. بناء مشروع أندرويد وإضافة ماسح التطبيقات الحقيقي
        run: |
          npm init -y
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5
          npx cap init Linko com.linko.share --web-dir www
          npx cap add android

          echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m" >> android/gradle.properties

          # تفعيل صلاحية رؤية كل التطبيقات المثبتة وصلاحيات الذاكرة الكاملة
          sed -i '/<application/i <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />\n<uses-permission android:name="android.permission.INTERNET" />\n<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n<uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />' android/app/src/main/AndroidManifest.xml

          # إنشاء كود الجافا لقراءة التطبيقات والألعاب واستخراج ملفات الـ APK
          mkdir -p android/app/src/main/java/com/linko/share/
          cat << 'EOF' > android/app/src/main/java/com/linko/share/AppScanner.java
          package com.linko.share;

          import android.content.pm.ApplicationInfo;
          import android.content.pm.PackageManager;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.util.List;

          @CapacitorPlugin(name = "AppScanner")
          public class AppScanner extends Plugin {
              @PluginMethod
              public void getInstalledApps(PluginCall call) {
                  try {
                      PackageManager pm = getContext().getPackageManager();
                      List<ApplicationInfo> packages = pm.getInstalledApplications(PackageManager.GET_META_DATA);
                      JSArray apps = new JSArray();

                      for (ApplicationInfo appInfo : packages) {
                          if ((appInfo.flags & ApplicationInfo.FLAG_SYSTEM) == 0) {
                              JSObject obj = new JSObject();
                              obj.put("appName", pm.getApplicationLabel(appInfo).toString());
                              obj.put("packageName", appInfo.packageName);
                              obj.put("sourceDir", appInfo.sourceDir);
                              apps.put(obj);
                          }
                      }
                      JSObject ret = new JSObject();
                      ret.put("apps", apps);
                      call.resolve(ret);
                  } catch (Exception e) {
                      call.reject(e.getMessage());
                  }
              }
          }
          EOF

          # تسجيل الإضافة داخل MainActivity
          cat << 'EOF' > android/app/src/main/java/com/linko/share/MainActivity.java
          package com.linko.share;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(AppScanner.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 6. استخراج ملف الـ APK وتجهيزه للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: Linko-Release-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
